<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ビンゴ抽選機</title>
<style>
  :root {
    --bg: #f6f7fb;
    --panel: #ffffff;
    --text: #1f2330;
    --muted: #7a8094;
    --accent: #e4572e;
    --cell: #eceef4;
    --hit: #2e86de;
    --hit-text: #ffffff;
    --last: #e4572e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161d;
      --panel: #1e212b;
      --text: #eef0f6;
      --muted: #9097ab;
      --cell: #2a2e3a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 16px 48px;
  }
  h1 { font-size: 1.4rem; margin: 0 0 16px; }
  .stage {
    background: var(--panel);
    border-radius: 16px;
    padding: 24px;
    text-align: center;
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
  }
  .letter { font-size: 2rem; font-weight: 700; color: var(--muted); height: 2.4rem; }
  .current {
    font-size: clamp(5rem, 22vw, 10rem);
    font-weight: 800;
    line-height: 1;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    min-height: 1em;
  }
  .current.rolling { color: var(--muted); }
  .count { color: var(--muted); margin: 8px 0 20px; }
  .controls { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  button {
    font: inherit;
    font-size: 1.1rem;
    padding: 12px 28px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
  }
  #draw { background: var(--accent); color: #fff; font-weight: 700; min-width: 160px; }
  #draw:disabled { opacity: .5; cursor: default; }
  #undo, #reset { background: var(--cell); color: var(--text); }
  .options { margin-top: 16px; color: var(--muted); font-size: .9rem; display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  .board {
    margin-top: 20px;
    background: var(--panel);
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
  }
  .row { display: grid; grid-template-columns: 40px repeat(15, minmax(0, 1fr)); gap: 4px; margin-bottom: 4px; }
  .row .head { font-weight: 800; display: grid; place-items: center; color: var(--muted); }
  .cell {
    aspect-ratio: 1;
    display: grid;
    place-items: center;
    background: var(--cell);
    border-radius: 6px;
    font-size: clamp(.6rem, 2.2vw, .95rem);
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }
  .cell.hit { background: var(--hit); color: var(--hit-text); font-weight: 700; }
  .cell.last { background: var(--last); color: #fff; }
  @media (max-width: 600px) {
    .board { padding: 10px; }
    .row { grid-template-columns: 18px repeat(15, minmax(0, 1fr)); gap: 2px; margin-bottom: 2px; }
    .cell { border-radius: 4px; font-size: clamp(.55rem, 2.6vw, .8rem); }
  }
  .history { margin-top: 12px; color: var(--muted); font-size: .9rem; word-break: break-all; }
</style>
</head>
<body>
<main>
  <h1>ビンゴ抽選機</h1>

  <section class="stage">
    <div class="letter" id="letter"></div>
    <div class="current" id="current">--</div>
    <div class="count" id="count"></div>
    <div class="controls">
      <button id="draw">抽選する</button>
      <button id="undo">1つ戻す</button>
      <button id="reset">リセット</button>
    </div>
    <div class="options">
      <label><input type="checkbox" id="animate" checked> 演出あり</label>
      <label><input type="checkbox" id="speak"> 読み上げ</label>
    </div>
  </section>

  <section class="board">
    <div id="grid"></div>
    <div class="history" id="history"></div>
  </section>
</main>

<script>
  const MAX = 75;
  const LETTERS = ["B", "I", "N", "G", "O"];
  const STORAGE_KEY = "bingo-drawn";

  const $ = (id) => document.getElementById(id);
  let drawn = load();
  let rolling = false;

  function load() {
    try {
      const v = JSON.parse(localStorage.getItem(STORAGE_KEY));
      return Array.isArray(v) ? v.filter((n) => Number.isInteger(n) && n >= 1 && n <= MAX) : [];
    } catch { return []; }
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(drawn)); } catch {}
  }

  const letterOf = (n) => LETTERS[Math.floor((n - 1) / 15)];

  // 偏りのない乱数（crypto が使えればそれを使う）
  function randomInt(max) {
    if (window.crypto?.getRandomValues) {
      const buf = new Uint32Array(1);
      const limit = Math.floor(0x100000000 / max) * max;
      do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
      return buf[0] % max;
    }
    return Math.floor(Math.random() * max);
  }

  function remaining() {
    const set = new Set(drawn);
    const list = [];
    for (let n = 1; n <= MAX; n++) if (!set.has(n)) list.push(n);
    return list;
  }

  function buildGrid() {
    const grid = $("grid");
    LETTERS.forEach((L, i) => {
      const row = document.createElement("div");
      row.className = "row";
      const head = document.createElement("div");
      head.className = "head";
      head.textContent = L;
      row.appendChild(head);
      for (let k = 1; k <= 15; k++) {
        const n = i * 15 + k;
        const c = document.createElement("div");
        c.className = "cell";
        c.id = "c" + n;
        c.textContent = n;
        row.appendChild(c);
      }
      grid.appendChild(row);
    });
  }

  function render() {
    const last = drawn[drawn.length - 1];
    if (!rolling) {
      $("current").textContent = last ?? "--";
      $("letter").textContent = last ? letterOf(last) : "";
    }
    $("count").textContent = `${drawn.length} / ${MAX} 個 抽選済み`;
    $("draw").disabled = rolling || drawn.length >= MAX;
    $("draw").textContent = drawn.length >= MAX ? "全て抽選済み" : "抽選する";
    const set = new Set(drawn);
    for (let n = 1; n <= MAX; n++) {
      const c = $("c" + n);
      c.classList.toggle("hit", set.has(n));
      c.classList.toggle("last", n === last);
    }
    $("history").textContent = drawn.length ? "履歴: " + drawn.join(" → ") : "";
  }

  function announce(n) {
    if (!$("speak").checked || !("speechSynthesis" in window)) return;
    const u = new SpeechSynthesisUtterance(`${letterOf(n)}の${n}`);
    u.lang = "ja-JP";
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }

  function draw() {
    const pool = remaining();
    if (!pool.length || rolling) return;
    const pick = pool[randomInt(pool.length)];

    const finish = () => {
      rolling = false;
      $("current").classList.remove("rolling");
      drawn.push(pick);
      save();
      render();
      announce(pick);
    };

    if (!$("animate").checked) return finish();

    rolling = true;
    $("current").classList.add("rolling");
    render();
    const start = performance.now();
    const tick = () => {
      const n = pool[randomInt(pool.length)];
      $("current").textContent = n;
      $("letter").textContent = letterOf(n);
      if (performance.now() - start < 1200) setTimeout(tick, 60);
      else finish();
    };
    tick();
  }

  $("draw").addEventListener("click", draw);
  $("undo").addEventListener("click", () => {
    if (rolling || !drawn.length) return;
    drawn.pop(); save(); render();
  });
  $("reset").addEventListener("click", () => {
    if (rolling || !drawn.length) return;
    if (!confirm("抽選結果をすべてリセットしますか？")) return;
    drawn = []; save(); render();
  });
  document.addEventListener("keydown", (e) => {
    if ((e.code === "Space" || e.code === "Enter") && e.target === document.body) {
      e.preventDefault();
      draw();
    }
  });

  buildGrid();
  render();
</script>
</body>
</html>
